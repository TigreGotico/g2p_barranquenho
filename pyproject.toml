[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2p_barranquenho"
dynamic = ["version"]
description = "Rule-based grapheme-to-phoneme converter for Barranquenho"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
dependencies = ["orthography2ipa>=7.19.3a1"]
keywords = ["barranquenho", "g2p", "grapheme-to-phoneme", "phonemizer", "ipa", "portuguese"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/TigreGotico/g2p_barranquenho"
Repository = "https://github.com/TigreGotico/g2p_barranquenho"

[tool.setuptools.packages.find]
where = ["."]
include = ["g2p_barranquenho*"]

[tool.setuptools.dynamic]
version = {attr = "g2p_barranquenho.version.VERSION_STR"}
